name: atlas

services:
  # ===========================================
  # 1. Vector Database - PostgreSQL + pgvector
  # ===========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_rag}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

  # ===========================================
  # 2. Database Admin - pgAdmin
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:8.10
    container_name: atlas-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@atlas.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - atlas-network

  # ===========================================
  # 3. LLM Local - Ollama (qwen2.5:7b)
  #    - Télécharge le modèle automatiquement au 1er lancement
  #    - Stocke le modèle dans un volume persistant (pas re-téléchargé)
  # ===========================================
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: atlas-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MODEL: ${VLLM_MODEL:-qwen2.5:3b}
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags | grep -q 'qwen2.5:3b'"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    networks:
      - atlas-network

  # ===========================================
  # 4. Backend API - FastAPI
  # ===========================================
  api:
    build:
      context: ./backend_api
      dockerfile: Dockerfile
    container_name: atlas-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      VLLM_URL: "http://ollama:11434/v1"
      VLLM_API_KEY: "ollama"
      VLLM_MODEL: ${VLLM_MODEL:-qwen2.5:3b}
      LLM_PROVIDER: "ollama"
      LLM_FALLBACK_ENABLED: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://atlas:atlas@postgres:5432/atlas_rag}
      VECTOR_TABLE: ${VECTOR_TABLE:-atlas_knowledge}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.40}
      TOP_K_RESULTS: ${TOP_K_RESULTS:-3}
      TEMPERATURE: ${TEMPERATURE:-0.0}
      MAX_TOKENS: ${MAX_TOKENS:-512}
      ENABLE_GUARDRAILS: ${ENABLE_GUARDRAILS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      HF_HOME: /app/.cache/huggingface
      GUARDRAILS_NO_TELEMETRY: "1"
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ./data_ingestion:/app/data_ingestion:ro
      - ./backend_api/config:/app/config:ro
      - hf_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "25", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s
    networks:
      - atlas-network

  # ===========================================
  # 5. Frontend UI - React
  # ===========================================
  ui:
    build:
      context: ./frontend_ui
      dockerfile: Dockerfile
    container_name: atlas-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - atlas-network

# ===========================================
# Networks
# ===========================================
networks:
  atlas-network:
    driver: bridge
    name: atlas-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    name: atlas-postgres-data
  pgadmin_data:
    name: atlas-pgadmin-data
  ollama_data:
    name: atlas-ollama-data
  hf_cache:
    name: atlas-hf-cache
